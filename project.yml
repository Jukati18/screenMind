name: GeminiOCRScanner
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"

targets:
  GeminiOCRScanner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # FIX (persistent NSCameraUsageDescription bug): removed the "info:
    # path: Info.plist" block. XcodeGen's own info-handling mechanism was
    # conflicting with the explicit INFOPLIST_FILE / GENERATE_INFOPLIST_FILE
    # settings below and silently winning, so our real Info.plist never
    # actually got wired in. Settings below are now the only mechanism.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.geminiocrscanner
        PRODUCT_NAME: GeminiOCRScanner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "This app uses the camera to scan text in real time."
